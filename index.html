const IMG1='';

const {useState,useMemo,useRef,useEffect}=React;

const GOAL=10000000;

let UID=100;

const COLORS=["#EF4444","#2563EB","#FACC15"];
function branchColor(fc){
  if(fc.지점==='금강')return '#EF4444';
  if(fc.지점==='서청주')return '#2563EB';
  if(fc.지점==='대전')return '#FACC15';
  return '#9CA3AF';
}
const RKC={1:"#F59E0B",2:"#8B9CB6",3:"#92400E"};
const isQ=f=>f.cmip>=2000000&&f.cnt>=5;
const INIT=(window.SUMMER_BOARD_DATA||[]);

const TRACK_H=500, BALLOON_H=60, LABEL_H=40;
const TRACK_W=3060, X_LEFT=60, X_RIGHT=3000;
function cx(cmip){
  const Z1=THIRD, Z2=THIRD, Z3=X_RIGHT-THIRD*2;
  if(cmip<=2000000){
    return X_LEFT+(cmip/2000000)*(Z1-X_LEFT);
  } else if(cmip<=5000000){
    return Z1+((cmip-2000000)/3000000)*Z2;
  } else {
    return Z1+Z2+((cmip-5000000)/5000000)*Z3;
  }
}
const THIRD=1000;
const ZONES=[
  {left:0,          width:THIRD,              vid:VID1, lbl:'하노이', sub:'일반(CMIP 0~200만)'},
  {left:THIRD,      width:THIRD,              vid:VID2, lbl:'싱가폴', sub:'더블(CMIP 200~500만)'},
  {left:THIRD*2,    width:TRACK_W-THIRD*2,    vid:VID3, lbl:'프라하\n빈\n부다페스트',   sub:'트리플(CMIP 500만~1000만)'},
];
const TICKS=[];
(function(){
  const Z1=THIRD;
  const Z2=THIRD;
  const Z3=X_RIGHT-THIRD*2;
  // 하노이: 4분할 (얇은선 3개: 50/100/150만, 경계 200만)
  for(let i=0;i<=4;i++){
    const x=X_LEFT+(Z1-X_LEFT)/4*i;
    const v=i*500000;
    TICKS.push({v,x,major:i===0||i===4,boundary:i===4});
  }
  // 싱가폴: 6분할 (얇은선 5개: 250/300/350/400/450만, 경계 500만)
  for(let i=1;i<=6;i++){
    const x=Z1+Z2/6*i;
    const v=2000000+i*500000;
    TICKS.push({v,x,major:i===6,boundary:i===6});
  }
  // 유럽: 5분할 (얇은선 4개: 600/700/800/900만, 경계 1000만)
  for(let i=1;i<=5;i++){
    const x=Z1+Z2+Z3/5*i;
    const v=5000000+i*1000000;
    TICKS.push({v,x,major:i===5,boundary:false});
  }
})();
function xpos(px,mobile){return mobile?(px/TRACK_W*MOBILE_TRACK_W):(px/TRACK_W*100)+'%';}
function wpos(px,mobile){return mobile?(px/TRACK_W*MOBILE_TRACK_W):(px/TRACK_W*100)+'%';}

function RaceCar(fc,q,col,isTop1=false){
  const nm=fc.name;
  const code=fc.사번;
  const branch=fc.지점;
  const gid='sm_'+fc.id;
  const faceImg=FACE_DATA[code];

  // 지점별 정장 색상
  const SUIT_COLORS={

    '대전':{top:'#5A5E66',bot:'#3A3D43',pTop:'#3A3D43',pBot:'#26282C',shoe:'#18191B',tie:'#4A4E55'},

  const speed = isTop1 ? '0.5s' : '0.32s';
  const bodyAnim  = isTop1 ? `banzaiBody_${gid}`  : `bodyBounce_${gid}`;

  const legLAnim  = isTop1 ? `banzaiLegL_${gid}`  : `thighL_${gid}`;

        h('linearGradient',{id:'suitGrad_'+gid,x1:0,y1:0,x2:1,y2:1},

          h('stop',{offset:'100%',stopColor:c.pBot})
        )
      ),
      h('style',null,`
        @keyframes bodyBounce_${gid}{0%,100%{transform:rotate(6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
        @keyframes headFollow_${gid}{0%,100%{transform:rotate(6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
        @keyframes thighL_${gid}{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(28deg)}}
        @keyframes thighR_${gid}{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-32deg)}}
        @keyframes calfL_${gid}{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-15deg)}}
        @keyframes calfR_${gid}{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(35deg)}}
        @keyframes armSwingL_${gid}{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-30deg)}}

        @keyframes banzaiBody_${gid}{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(0deg) translateY(-10px)}}

        @keyframes banzaiArmL_${gid}{0%,100%{transform:rotate(105deg)}50%{transform:rotate(125deg)}}
        @keyframes banzaiArmR_${gid}{0%,100%{transform:rotate(-105deg)}50%{transform:rotate(-125deg)}}

        @keyframes banzaiCalfL_${gid}{0%,100%{transform:rotate(30deg)}50%{transform:rotate(10deg)}}
        @keyframes banzaiCalfR_${gid}{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-10deg)}}
        .bg_${gid}{animation:${bodyAnim} ${speed} ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}

        .cfl_${gid}{transform-box:fill-box;transform-origin:50% 0%;animation:${calfLAnim} ${speed} ease-in-out infinite;}

        .arl_${gid}{transform-box:fill-box;transform-origin:50% 0%;animation:${armLAnim} ${speed} ease-in-out infinite;}
        .arr_${gid}{transform-box:fill-box;transform-origin:50% 0%;animation:${armRAnim} ${speed} ease-in-out infinite;}50%{transform:rotate(35deg)}}
        @keyframes armSwingL_${gid}{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-30deg)}}
        @keyframes armSwingR_${gid}{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(35deg)}}
        
      `),
      h('g',{className:'bg_'+gid},
        h('rect',{x:31,y:86,width:8,height:8,fill:'#F2C9A0',rx:2}),
        h('path',{d:'M 23 94 Q 35 90 47 94 L 49 118 Q 35 122 21 118 Z',fill:'url(#suitGrad_'+gid+')'}),
        h('path',{d:'M 31 94 L 35 100 L 39 94',fill:'white'}),
        h('path',{d:'M 33 96 L 37 96 L 36 108 L 35 112 L 34 108 Z',fill:c.tie})

      h('g',{className:'arl_'+gid},
        h('rect',{x:15,y:96,width:8,height:27,rx:4,fill:'url(#suitGrad_'+gid+')'}),
        h('rect',{x:16,y:121,width:7,height:6,rx:3,fill:'#F2C9A0'})
      ),
      h('g',{className:'arr_'+gid},
        h('rect',{x:47,y:96,width:8,height:27,rx:4,fill:'url(#suitGrad_'+gid+')'}),
        h('rect',{x:47,y:121,width:7,height:6,rx:3,fill:'#F2C9A0'})
      ),
      h('g',{className:'thl_'+gid},
        h('rect',{x:24,y:118,width:9,height:16,rx:3,fill:'url(#pantsGrad_'+gid+')'}),
        h('g',{className:'cfl_'+gid},
          h('rect',{x:24,y:134,width:9,height:4,rx:2,fill:c.pBot}),
          h('ellipse',{cx:28,cy:139,rx:6,ry:3,fill:c.shoe})

      ),
      h('g',{className:'thr_'+gid},
        h('rect',{x:37,y:118,width:9,height:16,rx:3,fill:'url(#pantsGrad_'+gid+')'}),
        h('g',{className:'cfr_'+gid},
          h('rect',{x:37,y:134,width:9,height:4,rx:2,fill:c.pBot}),
          h('ellipse',{cx:41,cy:139,rx:6,ry:3,fill:c.shoe})
        )
      ),
      h('text',{x:35,y:153,textAnchor:'middle',fill:'white',fontSize:20,fontWeight:900,fontFamily:'sans-serif',paintOrder:'stroke',stroke:'rgba(0,0,0,0.72)',strokeWidth:2,strokeLinejoin:'round'},nm)
    ),
    h('div',{style:{position:'absolute',top:0,left:5.5,width:66,height:99,zIndex:3,transformBox:'fill-box',transformOrigin:'50% 100%',animation:`${headAnim} ${speed} ease-in-out infinite`}},
      h('img',{src:(String(faceImg).startsWith('data:')||String(faceImg).startsWith('assets/')?faceImg:'data:image/png;base64,'+faceImg),style:{width:66,height:99,pointerEvents:'none',display:'block'}})
    )
  );
}

function getLevel(fc){
  if(fc.cmip>=10000000&&fc.cnt>=5)return{lbl:'Triple',col:'#7C3AED'};
  if(fc.cmip>=5000000&&fc.cnt>=5)return{lbl:'Double',col:'#2563EB'};
  if(fc.cmip>=2000000&&fc.cnt>=5)return{lbl:'Single',col:'#059669'};
  return{lbl:'미달',col:'#9CA3AF'};
}

function App(){
  const [fcs,setFCs]=useState(INIT);
  const [showEdit,setShowEdit]=useState(false);
  const [sortBy,setSortBy]=useState('cmip');
  const [showPopup,setShowPopup]=useState(false);
  const [searchId,setSearchId]=useState('');
  const [searching,setSearching]=useState(false);
  const [inputVal,setInputVal]=useState('');
  const [newName,setNewName]=useState('');
  const [showRanking,setShowRanking]=useState(false);

  const ranked=useMemo(()=>{
    const q=fcs.filter(isQ).sort((a,b)=>b.canp-a.canp);
    const nq=fcs.filter(f=>!isQ(f)).sort((a,b)=>b.cmip-a.cmip);
    return[...q,...nq];
  },[fcs]);
  const allSorted=useMemo(()=>
    [...fcs].sort((a,b)=>{
      if(sortBy==='cmip')return b.cmip-a.cmip;
      if(sortBy==='cnt')return b.cnt-a.cnt;
      return b.canp-a.canp;
    })
  ,[fcs,sortBy]);
  const top10=allSorted.slice(0,10);
  const searchResult=useMemo(()=>{
    if(!searching||!searchId.trim())return null;
    const fc=fcs.find(f=>f.사번===searchId.trim());
    if(!fc)return null;
    const rank=allSorted.findIndex(f=>f.id===fc.id)+1;
    return{fc,rank};
  },[searching,searchId,fcs,allSorted]);
  const displayRows=searching
    ?(searchResult?[{fc:searchResult.fc,rank:searchResult.rank}]:[])
    :top10.map((fc,i)=>({fc,rank:i+1}));

  const laneH=Math.floor((TRACK_H-LABEL_H-BALLOON_H)/Math.max(fcs.length,1));

  // PC: 뷰포트에 맞게 비율 스케일 / 모바일: 2200px 고정 + 좌우 스크롤
  const [trackScale,setTrackScale]=useState(1);
  const [pcTrackH,setPcTrackH]=useState(TRACK_H);
  const [isMobileView,setIsMobileView]=useState(false);
  const trackW=isMobileView?MOBILE_TRACK_W:TRACK_W;
  useEffect(()=>{
    function calcScale(){
      const mobile=window.innerWidth<=768;
      setIsMobileView(mobile);
      if(mobile){
        setTrackScale(1);
        const vh=window.innerHeight;
        const mobileHeaderH=52;
        const mobileRankButtonH=52; // 모바일 하단 여백 균형을 위해 현황판 높이 14px 확대
        const mobileH=Math.max(434, vh-mobileHeaderH-mobileRankButtonH);
        setPcTrackH(mobileH);
        return;
      }
      const vw=window.innerWidth;
      const vh=window.innerHeight;
      const scaleW=vw/trackW;
      const availableH=Math.max(520, vh-60-66);
      setTrackScale(scaleW);
      setPcTrackH(availableH);
    }
    calcScale();
    window.addEventListener('resize',calcScale);
    return()=>window.removeEventListener('resize',calcScale);
  },[]);

  // 스크롤하면 힌트 숨기기
  useEffect(()=>{
    const el = document.querySelector('[id="scrollHint"]');
    if(!el) return;
    const hide = ()=>{ el.style.opacity='0'; };
    window.addEventListener('scroll', hide, {passive:true, once:true});
    // 터치 스크롤도 감지
    const trackEl = document.querySelector('[style*="overflowX"]');
    if(trackEl) trackEl.addEventListener('scroll', hide, {passive:true, once:true});
    return()=>window.removeEventListener('scroll', hide);
  },[isMobileView]);

  function upd(id,key,val){setFCs(p=>p.map(f=>f.id===id?{...f,[key]:Number(val)||0}:f));}
  function add(){
    if(!newName.trim())return;
    setFCs(p=>[...p,{id:UID++,team:newTeam,name:newName.trim(),cmip:0,cnt:0.0,canp:0}]);
    setNewName('');
  }
  function del(id){setFCs(p=>p.filter(f=>f.id!==id));}

  return h('div',{style:{fontFamily:'-apple-system,BlinkMacSystemFont,sans-serif',background:'#f5f5f5',height:'auto',minHeight:'100dvh',display:'flex',flexDirection:'column',overflowY:'auto',overflowX:'hidden'}},

    h('div',{style:{background:'#0B1F45',padding:'clamp(8px,2vw,10px) clamp(10px,3vw,14px)',display:'flex',alignItems:'center',justifyContent:'flex-start',flexWrap:'nowrap',gap:8,position:'sticky',top:0,zIndex:9999,width:'100%',maxWidth:'100vw',overflow:'hidden',boxShadow:'0 2px 10px rgba(0,0,0,0.18)'}},

      ...ZONES.map((z,i)=>h('div',{key:i,style:{

      ...ZONES.map((z,i)=>h('div',{key:'zl'+i,style:{

      ...TICKS.map(({v,major,x,boundary})=>{

        // 캐릭터 확대 후에도 잘리지 않게, X/Y축을 모두 활용해서 배치
        const VISUAL_W = isMobileView ? 77 * 0.42 : 77;
        const VISUAL_H = isMobileView ? 176 * 0.42 : 176;
        const AVOID_W = isMobileView ? 58 : 112;
        const AVOID_H = isMobileView ? 88 : 205;
        const visibleH = pcTrackH;
        const topPad = isMobileView ? 10 : 14;
        const bottomPad = isMobileView ? 10 : 14;
        const usableTop = topPad + VISUAL_H / 2;
        const usableBottom = Math.max(usableTop, visibleH - LABEL_H - bottomPad - VISUAL_H / 2);
        const usableRange = Math.max(1, usableBottom - usableTop);
        const laneCount = Math.max(2, Math.min(isMobileView ? 11 : 8, Math.floor(usableRange / (AVOID_H * 0.72)) + 1));
        const lanes = Array.from({length: laneCount}, (_, i) => laneCount === 1 ? usableTop + usableRange / 2 : usableTop + (usableRange * i / (laneCount - 1)));

        // 1. CMIP>0 인 FC만 cx값 계산
        const activeFcs = fcs.filter(fc => fc.cmip > 0).map(fc => ({
          fc,
          x: cx(fc.cmip),
        })).sort((a,b)=>a.x-b.x || b.fc.cmip-a.fc.cmip);

        // 2. CMIP 위치 정확도를 위해 X축은 절대 보정하지 않음
        //    겹침은 Y축 레인 선택으로만 해결한다.
        const xAdjusted = activeFcs.map(item => ({...item, xAdj: item.x}));

        // 3. 각 캐릭터마다 기존 배치와 가장 덜 겹치는 Y 레인을 선택
        const placed=[];
        const positioned=xAdjusted.map((item)=>{
          let bestY=lanes[0];
          let bestScore=Infinity;
          lanes.forEach((candidateY, laneIdx)=>{
            let score=0;
            placed.forEach(p=>{
              const dx=Math.abs(item.xAdj-p.x);
              const dy=Math.abs(candidateY-p.y);
              if(dx<AVOID_W && dy<AVOID_H){
                score += (AVOID_W-dx)*(AVOID_H-dy);
              }
              // X가 가까우면 Y를 더 멀리 쓰도록 추가 페널티
              if(dx<AVOID_W*0.72) score += Math.max(0, (AVOID_H*0.95-dy))*45;
            });
            // 같은 레인만 몰리지 않게 약한 페널티
            score += placed.filter(p=>p.laneIdx===laneIdx).length * 180;
            if(score<bestScore){bestScore=score;bestY=candidateY;}
          });
          const pos={...item,x:item.xAdj,y:bestY,laneIdx:lanes.indexOf(bestY)};
          placed.push(pos);
          return pos;
        });

        // CMIP 1등 FC id 계산
        const top1Id = positioned.length > 0
          ? positioned.reduce((a,b) => a.fc.cmip >= b.fc.cmip ? a : b).fc.id
          : -1;

        return positioned.map((item) => {
          const { fc } = item;
          const col = branchColor(fc);
          const q = isQ(fc);
          const isTop1 = fc.cmip > 0 && fc.id === top1Id;
          return h('div', {key: fc.id, style: {
            position: 'absolute',
            left: xpos(item.x, isMobileView),
            top: item.y,
            transform: isMobileView ? 'translate(-50%,-50%) scale(0.441)': 'translate(-50%,-50%) scale(0.95)',
            transformOrigin: 'center center',
            zIndex: isTop1 ? 120 : 90,
            transition:'left 0.8s ease, top 0.8s ease',
        }},
          RaceCar(fc,q,col,isTop1)
        );
        });
      })()
    ) // 트랙 inner (scale container)
    ) // outer track (height wrapper)
    ), // scroll wrapper

        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,

          fontSize: 9, color: 'white', writingMode: 'vertical-rl',
          letterSpacing: 2, opacity: 0.9, marginTop: 4,
        }}, '밀어주세요')
      )
    ),

    h('div',{style:{margin:isMobileView?'6px 8px 8px':'8px 12px 12px',borderRadius:12,overflow:'hidden',border:'1.5px solid #E5E7EB',boxShadow:'0 2px 12px rgba(0,0,0,0.07)',flexShrink:0,position:'relative',zIndex:20,background:'white'}},
    h('div',{
      onClick:()=>setShowRanking(v=>!v),
      style:{background:'#0B1F45',padding:isMobileView?'10px 14px':'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,cursor:'pointer',userSelect:'none',position:'relative',zIndex:3}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8}},
        h('i',{className:'ti ti-trophy',style:{fontSize:16,color:'#FCD34D'}}),
        h('span',{style:{fontWeight:600,fontSize:14,color:'white'}},showRanking?'업적 접기':'금강사업본부 개인 순위 TOP 10 조회')
      ),
      h('i',{className:showRanking?'ti ti-chevron-up':'ti ti-chevron-down',style:{fontSize:16,color:'rgba(255,255,255,0.7)'}})
    ),
    h('div',{style:{

    h('div',{style:{minHeight:0,overflow:'hidden',alignSelf:'start'}},
    h('div',{style:{padding:'14px',minHeight:0}},
      h('div',{style:{marginBottom:14}},
        h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}},
          ...([['cmip','CMIP 순위'],['canp','CANP 순위'],['cnt','건수 순위']].map(([key,lbl])=>
            h('button',{key,onClick:()=>setSortBy(key),style:{

    showPopup&&h('div',{style:{

}

</script>

    cursor: pointer;
    box-shadow: 0 10px 24px rgba(10, 95, 180, 0.28);
    transition: filter .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  #internalNoticeTodayBtn:hover {
    filter: brightness(1.08);
    box-shadow: 0 12px 28px rgba(10, 95, 180, 0.34);
  }
  #internalNoticeTodayBtn:active { transform: scale(0.985); }
  @media (max-width: 420px) {
    #internalNoticeOverlay { padding: 14px; align-items: center; }
    #internalNoticeBox { width: min(94vw, 420px); border-radius: 20px; }
    #internalNoticeHeader { padding: 32px 46px 17px; }
    #internalNoticeBody { padding: 25px 21px 20px; }
    #internalNoticeActions { padding: 0 21px 27px; }
    #internalNoticeClose { top: 12px; right: 12px; }
  }
</style>
<div id="internalNoticeOverlay" role="dialog" aria-modal="true" aria-labelledby="internalNoticeTitle">
  <div id="internalNoticeBox">
    <div id="internalNoticeHeader">
      <button id="internalNoticeClose" type="button" aria-label="닫기">×</button>
      <h2 id="internalNoticeTitle">2026 금강사업본부<span>SUMMER 그랑프리 현황판</span></h2>
    </div>
    <div id="internalNoticeBody">
      <p>⚠️ 본 페이지는 금강사업본부 내부용입니다.<br>외부 공유 및 유출을 금지합니다.</p>
    </div>
    <div id="internalNoticeActions">
      <button id="internalNoticeTodayBtn" type="button">오늘 하루 보지 않기</button>
    </div>
  </div>
</div>
<script id="internalNoticePopupScript">
(function(){
  var KEY = 'greatSummerNoticeHiddenDate';
  var overlay = document.getElementById('internalNoticeOverlay');
  var closeBtn = document.getElementById('internalNoticeClose');
  var todayBtn = document.getElementById('internalNoticeTodayBtn');
  function todayString(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function hide(){
    if (overlay) overlay.style.display = 'none';
  }
  function show(){
    if (overlay) overlay.style.display = 'flex';
  }
  try {
    if (localStorage.getItem(KEY) !== todayString()) show();
  } catch(e) { show(); }
  if (closeBtn) closeBtn.addEventListener('click', function(){
    hide();
  });
  if (todayBtn) todayBtn.addEventListener('click', function(){
    try { localStorage.setItem(KEY, todayString()); } catch(e) {}
    hide();
  });
})();
</script>
